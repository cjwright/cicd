name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:9

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: |
        cat /etc/os-release
        yum -y install gcc 
        yum -y install make 
        make 
      

name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: debian:12

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: |
        cat /etc/os-release
        apt update
        apt install tmux
        make 
      
